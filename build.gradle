plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Ab Minecraft 26.x ist das Spiel nicht mehr obfuskiert. Es gibt weder
    // Mojang-Mappings noch Intermediary, deshalb steht hier bewusst keine
    // mappings-Zeile. Die Klassennamen im Quellcode sind die echten.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // Ohne Obfuskierung gibt es kein modImplementation mehr, Mod-Abhaengigkeiten
    // muessen nicht umgeschrieben werden.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Automatic client test: starts the real game, loads a world and takes
// screenshots of every event look (task runClientGameTest).
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "nightsiege-test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
