plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

// Stand-ins for the few Iris classes the uniform mixin names. They are only
// used to compile and are never packaged; at run time Iris brings the real ones.
sourceSets {
    irisstubs {
        java.srcDir 'src/irisstubs/java'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Ab Minecraft 26.x ist das Spiel nicht mehr obfuskiert. Es gibt weder
    // Mojang-Mappings noch Intermediary, deshalb steht hier bewusst keine
    // mappings-Zeile. Die Klassennamen im Quellcode sind die echten.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // Ohne Obfuskierung gibt es kein modImplementation mehr, Mod-Abhaengigkeiten
    // muessen nicht umgeschrieben werden.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly sourceSets.irisstubs.output

    // Only for the shader test in CI: Iris and Sodium from the run-mods folder.
    if (System.getenv("NIGHTSIEGE_WITH_IRIS") != null) {
        runtimeOnly fileTree(dir: 'run-mods', include: '*.jar')
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Automatic client test: starts the real game, loads a world and takes
// screenshots of every event look (task runClientGameTest).
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "nightsiege-test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

// The Night Siege shader pack (a changed Photon, see shaderpack/) is zipped
// into the jar; the mod copies it into the shaderpacks folder on start.
def zipShaderPack = tasks.register('zipShaderPack', Zip) {
    from 'shaderpack/NightSiege-Photon'
    archiveFileName.set('NightSiege-Photon.zip')
    destinationDirectory.set(layout.buildDirectory.dir('shaderpack'))
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Which build a statistics file came from (the statistics logger, 28 October 2026): the commit
// the CI built, so data from before and after a balancing change can be told apart.
def buildCommit = (System.getenv("GITHUB_SHA") ?: "lokal").take(7)
def writeBuildInfo = tasks.register('writeBuildInfo') {
    def out = layout.buildDirectory.file('generated/buildinfo/nightsiege-build.properties')
    inputs.property "commit", buildCommit
    outputs.file out
    doLast {
        def file = out.get().asFile
        file.parentFile.mkdirs()
        file.text = "commit=" + buildCommit + "\n"
    }
}

processResources {
    inputs.property "version", project.version
    from(writeBuildInfo) {
        into 'assets/nightsiege'
    }
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
    from(zipShaderPack) {
        into 'assets/nightsiege/shaderpacks'
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
