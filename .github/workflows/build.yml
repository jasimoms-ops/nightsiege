name: build

on:
  push:
    branches: [main, 'version-*']
  workflow_dispatch:
    inputs:
      quick:
        description: 'Nur bauen und API-Auszug, ohne Server- und Client-Test'
        type: boolean
        default: false
      scenes:
        description: 'Nur diese Client-Szenen (z. B. "camp,machines"), ohne Server-Probelauf und Shader'
        type: string
        default: ''
      api:
        description: 'Auch den API-Auszug (javap) und vanilla.zip schreiben'
        type: boolean
        default: false
      together:
        description: 'Alle Szenen nacheinander in einem Spiel (wie vor dem 05.11.) statt parallel'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Since 05.11. (Simon: "bekommen wir das hin das diese test nicht immer ewig dauern?") the work is split:
  # every scene (or a small package of them) runs on a runner of its own, the full run in four parts plus
  # the shader run and the server start side by side; "collect" puts the results into one dist branch.
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.p.outputs.groups }}
      slug: ${{ steps.p.outputs.slug }}
    steps:
      - id: p
        env:
          SCENES: ${{ inputs.scenes }}
          QUICK: ${{ inputs.quick }}
          TOGETHER: ${{ inputs.together }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import json, math, os, re
          msg = os.environ.get("COMMIT_MSG") or ""
          scenes = (os.environ.get("SCENES") or "").strip()
          m = re.search(r"\[scenes ([^\]]*)\]", msg)
          if not scenes and m:
              scenes = m.group(1).strip()
          quick = os.environ.get("QUICK") == "true" or "[quick]" in msg
          together = os.environ.get("TOGETHER") == "true" or "[together]" in msg
          if quick:
              groups = ["quick"]
          elif "[sim" in msg:
              groups = ["sim"]
          elif scenes:
              names = [x for x in scenes.lower().replace(" ", "").split(",") if x]
              if together or len(names) <= 1:
                  groups = ["s:" + ",".join(names)]
              else:
                  jobs = min(len(names), 6)
                  size = math.ceil(len(names) / jobs)
                  groups = ["s:" + ",".join(names[i:i + size]) for i in range(0, len(names), size)]
          else:
              groups = ["server", "full:1", "full:2", "full:3", "full:4"]
              if "[noshader]" not in msg:
                  groups.append("shader")
          slug = re.sub(r"-+", "-", re.sub(r"[^a-z0-9]", "-", scenes.lower())).strip("-")[:40] if scenes else ""
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("groups=%s\n" % json.dumps(groups))
              out.write("slug=%s\n" % slug)
          print("::notice title=PLAN::%s" % " | ".join(groups))
          PY

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4

      # fabric-api und Loader aendern sich staendig. Statt sie zu raten, wird
      # hier die jeweils neueste zur eingestellten Minecraft-Version passende
      # Fassung ermittelt und in gradle.properties eingetragen.
      - name: Passende Abhaengigkeiten waehlen
        run: |
          python3 - <<'PY'
          import json, re, urllib.request

          props = {}
          for line in open("gradle.properties", encoding="utf-8"):
              if "=" in line and not line.strip().startswith("#"):
                  k, v = line.split("=", 1)
                  props[k.strip()] = v.strip()
          mc = props["minecraft_version"]

          xml = urllib.request.urlopen(
              "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml",
              timeout=30).read().decode()
          api = [v for v in re.findall(r"<version>([^<]+)</version>", xml) if v.endswith("+" + mc)]
          if not api:
              print("::error title=KEINE-API::fabric-api hat keine Fassung fuer %s%%0AVerfuegbar: %s"
                    % (mc, ", ".join(re.findall(r"<version>([^<]+)</version>", xml)[-40:])))
              raise SystemExit(1)

          loaders = json.loads(urllib.request.urlopen(
              "https://meta.fabricmc.net/v2/versions/loader", timeout=30).read().decode())
          loader = loaders[0]["version"]

          text = open("gradle.properties", encoding="utf-8").read()
          text = re.sub(r"(?m)^fabric_version=.*$", "fabric_version=" + api[-1], text)
          text = re.sub(r"(?m)^loader_version=.*$", "loader_version=" + loader, text)
          open("gradle.properties", "w", encoding="utf-8").write(text)
          print("::notice title=GEWAEHLT::mc=%s api=%s loader=%s" % (mc, api[-1], loader))
          PY

      # Fuer den Shader-Test: Iris, Sodium und ein fremdes Shader-Pack von Modrinth
      # (das eigene Night-Siege-Pack legt die Mod selbst in den shaderpacks-Ordner).
      - name: Shader-Testmaterial laden
        if: matrix.group == 'shader'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "nightsiege-ci"})
              return urllib.request.urlopen(req, timeout=60).read()
          os.makedirs("run-mods", exist_ok=True)
          os.makedirs("run-shaderpacks", exist_ok=True)
          mc = [l.split("=",1)[1].strip() for l in open("gradle.properties") if l.startswith("minecraft_version")][0]
          for slug in ("sodium", "iris"):
              q = urllib.parse.urlencode({"game_versions": json.dumps([mc]), "loaders": json.dumps(["fabric"])})
              versions = json.loads(get("https://api.modrinth.com/v2/project/%s/version?%s" % (slug, q)))
              if not versions:
                  print("::warning title=SHADERTEST::keine %s-Fassung fuer %s" % (slug, mc)); continue
              f = [x for x in versions[0]["files"] if x.get("primary")] or versions[0]["files"]
              open("run-mods/" + f[0]["filename"], "wb").write(get(f[0]["url"]))
              print("::notice title=SHADERTEST::%s %s" % (slug, versions[0]["version_number"]))
          for query in ("complementary reimagined",):
              hits = json.loads(get("https://api.modrinth.com/v2/search?" + urllib.parse.urlencode(
                  {"query": query, "facets": json.dumps([["project_type:shader"]]), "limit": 3})))["hits"]
              if not hits:
                  print("::warning title=SHADERTEST::kein Pack fuer %s" % query); continue
              slug = hits[0]["slug"]
              versions = json.loads(get("https://api.modrinth.com/v2/project/%s/version" % slug))
              f = [x for x in versions[0]["files"] if x.get("primary")] or versions[0]["files"]
              open("run-shaderpacks/" + f[0]["filename"], "wb").write(get(f[0]["url"]))
              print("::notice title=SHADERTEST::Pack %s %s" % (slug, f[0]["filename"]))
          PY

      - name: JDK 25 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Bauen
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build-output.txt

      # Signaturen ausgewaehlter Minecraft-Klassen (javap) fuer die Entwicklung:
      # die Entwicklungsumgebung hat keine Minecraft-Quellen.
      - name: API-Auszug
        if: always() && (inputs.api || matrix.group == 'quick' || matrix.group == 'server')
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import glob, os, subprocess, zipfile
          want = [l.strip() for l in open("tools/api-classes.txt") if l.strip() and not l.startswith("#")] if os.path.exists("tools/api-classes.txt") else []
          jars = [j for j in glob.glob(os.path.expanduser("~/.gradle/caches/**/*.jar"), recursive=True) + glob.glob(".gradle/**/*.jar", recursive=True)
                  if "minecraft" in os.path.basename(j).lower()]
          found = None
          for j in jars:
              try:
                  n = zipfile.ZipFile(j).namelist()
                  if "net/minecraft/world/level/levelgen/structure/StructureStart.class" in n:
                      # Prefer the jar with the client classes too (the server jar has no models).
                      if found is None or "net/minecraft/client/Minecraft.class" in n:
                          found = j
                      if "net/minecraft/client/Minecraft.class" in n:
                          break
              except Exception:
                  pass
          # Vanilla pictures for the texture tools (tools/vanilla-extract.txt: one path prefix per line),
          # searched in every Minecraft jar of the cache, zipped as vanilla.zip into the dist branch.
          if os.path.exists("tools/vanilla-extract.txt"):
              prefixes = [l.strip() for l in open("tools/vanilla-extract.txt") if l.strip() and not l.startswith("#")]
              allj = glob.glob(os.path.expanduser("~/.gradle/caches/**/*.jar"), recursive=True) + glob.glob(".gradle/**/*.jar", recursive=True)
              taken = {}
              for j in allj:
                  try:
                      z = zipfile.ZipFile(j)
                      for n in z.namelist():
                          if any(n.startswith(p) for p in prefixes) and n not in taken:
                              taken[n] = z.read(n)
                  except Exception:
                      pass
              with zipfile.ZipFile("vanilla.zip", "w", zipfile.ZIP_DEFLATED) as vz:
                  for n, data in taken.items():
                      vz.writestr(n, data)
              print("vanilla files:", len(taken))
          out = open("api.txt", "w")
          if os.path.exists("tools/vanilla-extract.txt"):
              out.write("vanilla files: %d\n" % len(taken))
          out.write("jar: %s\n" % found)
          if found:
              names = zipfile.ZipFile(found).namelist()
              for w in want:
                  if w.startswith("%"):
                      # "%Text": alle Klassen, deren Pfad den Text enthaelt (nur Namen)
                      pat = w[1:]
                      hits = [n for n in names if n.endswith(".class") and pat in n]
                      out.write("== names %s\n%s\n\n" % (pat, "\n".join(hits[:200])))
                      continue
                  if w.startswith("?"):
                      # "?Klasse#text": in welchen Methoden die Zeile mit "text" vorkommt
                      cls, _, pat = w[1:].partition("#")
                      r = subprocess.run(["javap", "-c", "-p", "-cp", found, cls], capture_output=True, text=True)
                      out.write("== grep %s\n" % w[1:])
                      head = ""
                      for line in (r.stdout or r.stderr).splitlines():
                          if line.startswith("  ") and not line.startswith("   ") and "(" in line:
                              head = line
                          elif pat in line:
                              out.write(head + "\n    " + line.strip() + "\n")
                      out.write("\n")
                      continue
                  if w.startswith("!"):
                      # "!Klasse#methode1,methode2": Bytecode (javap -c) nur dieser Methoden
                      cls, _, meths = w[1:].partition("#")
                      r = subprocess.run(["javap", "-c", "-p", "-cp", found, cls], capture_output=True, text=True)
                      text = r.stdout or r.stderr
                      out.write("== bytecode %s\n" % w[1:])
                      keep = False
                      for line in text.splitlines():
                          if line.startswith("  ") and not line.startswith("   ") and "(" in line:
                              name = line.split("(")[0].split()[-1]
                              keep = any(name == m or name.endswith("." + m) for m in meths.split(","))
                          if keep:
                              out.write(line + "\n")
                      out.write("\n")
                      continue
                  if w.endswith("*"):
                      hits = [n[:-6].replace("/", ".") for n in names if n.endswith(".class") and n.startswith(w[:-1].replace(".", "/")) and "$" not in n]
                  else:
                      hits = [w]
                  for cls in hits[:40]:
                      r = subprocess.run(["javap", "-p", "-cp", found, cls], capture_output=True, text=True)
                      out.write(r.stdout or r.stderr)
                      out.write("\n")
          out.close()
          print("::notice title=API::%s" % found)
          PY

      # Die Rohprotokolle liegen auf einem Speicher, den die Entwicklungsumgebung
      # nicht erreicht. Die wichtigen Zeilen gehen daher als Annotation raus.
      - name: Fehler als Annotation melden
        if: always()
        run: |
          python3 - <<'PY'
          import re, os
          try:
              text = open("build-output.txt", encoding="utf-8", errors="replace").read()
          except FileNotFoundError:
              print("::error title=BUILD::build-output.txt fehlt")
              raise SystemExit(0)
          pat = re.compile(r"(PROBE:|error:|warning:|FAILURE|What went wrong|Caused by|Could not|Execution failed|^\s*>|\.java:\d+)", re.M)
          lines = [l.rstrip() for l in text.splitlines() if pat.search(l)]
          if not lines:
              lines = text.splitlines()[-80:]
          chunk, size, part = [], 0, 1
          for line in lines[-250:]:
              if size + len(line) > 7000:
                  print("::error title=BUILD%d::" % part + "%0A".join(chunk))
                  chunk, size, part = [], 0, part + 1
              chunk.append(line)
              size += len(line) + 1
          if chunk:
              print("::error title=BUILD%d::" % part + "%0A".join(chunk))
          PY

      # Ein echter Serverstart deckt Fehler auf, die der Compiler nicht sieht:
      # Registrierung, Rezepte, Tags, Weltgenerierung. Nach einigen Minuten
      # wird der Server einfach beendet.
      - name: Server-Probelauf
        if: steps.build.outcome == 'success' && matrix.group == 'server'
        continue-on-error: true
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "level-seed=nightsiege\nonline-mode=false\nmax-tick-time=-1\n" > run/server.properties
          timeout 600 gradle runServer --no-daemon --args=nogui > server-output.txt 2>&1 || true
          python3 - <<'PY'
          import re
          text = open("server-output.txt", encoding="utf-8", errors="replace").read()
          pat = re.compile(r"(ERROR|Exception|Caused by|Failed|Couldn't|Unknown|Night Siege|Done \(|Missing|Invalid|nightsiege)", re.I)
          lines = [l.rstrip()[:400] for l in text.splitlines() if pat.search(l)]
          started = any("Done (" in l for l in lines)
          print("::notice title=SERVERSTART::%s" % ("ok" if started else "NICHT gestartet"))
          chunk, size, part = [], 0, 1
          for line in lines[:120]:
              if size + len(line) > 7000:
                  print("::warning title=SERVER%d::" % part + "%0A".join(chunk))
                  chunk, size, part = [], 0, part + 1
              chunk.append(line)
              size += len(line) + 1
          if chunk:
              print("::warning title=SERVER%d::" % part + "%0A".join(chunk))
          if not lines:
              print("::warning title=SERVER-TAIL::" + "%0A".join(text.splitlines()[-40:]))
          PY

      # Ein echter Client-Start (Fabric Client-Gametest, Software-Grafik) laedt
      # eine Welt, prueft alle Mixins und fotografiert jedes Ereignis. Die Bilder
      # wandern mit der Jar in den dist-Branch.
      - name: Client-Test
        if: steps.build.outcome == 'success' && matrix.group != 'quick' && matrix.group != 'server'
        continue-on-error: true
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          GROUP: ${{ matrix.group }}
        run: |
          set +e
          # The group of this runner (plan job): "s:a,b" these scenes, "full:N" part N of the full run,
          # "shader" only the shader run, "sim" the melee simulation of the commit message.
          case "$GROUP" in
            s:*) export NIGHTSIEGE_SCENES="${GROUP#s:}" ;;
            full:*) export NIGHTSIEGE_FULLPART="${GROUP#full:}" ;;
          esac
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1
          CLIENT_TIMEOUT=3600
          # [sim] in the commit message: only the melee balance simulation, with more time.
          if [[ "$COMMIT_MSG" == *"[sim"* ]]; then
            SIMARG=$(printf '%s' "$COMMIT_MSG" | grep -o '\[sim[^]]*\]' | head -1 | sed 's/^\[sim//; s/\]$//')
            export NIGHTSIEGE_SIM="1 $SIMARG"
            CLIENT_TIMEOUT=12000
          fi
          # Shortly before the time is up: a thread dump of the game (shows where a hang sits).
          mkdir -p shots
          if [ "$GROUP" != "shader" ]; then
            ( sleep $((CLIENT_TIMEOUT - 60)); for p in $(pgrep -f "KnotClient|net.fabricmc.devlaunchinjector" || true); do echo "THREADDUMP $p" >> client-threads.txt; jstack "$p" >> client-threads.txt 2>&1 || true; done ) &
            DUMPER=$!
            timeout $CLIENT_TIMEOUT xvfb-run -a -s "-screen 0 1280x720x24" gradle runClientGameTest --no-daemon --stacktrace > client-output.txt 2>&1
            echo "exit=$?" >> client-output.txt
            kill $DUMPER 2>/dev/null || true
            if [ -f client-threads.txt ]; then grep -A40 '"Server thread"\|"Render thread"\|"Test thread' client-threads.txt >> client-output.txt || true; fi
            cp client-output.txt client-main-output.txt
            find . -path ./shots -prune -o -name "*.png" -path "*screenshot*" -newer build.gradle -print | while read f; do cp "$f" shots/; done
          fi
          # The shader run (its own runner since 05.11.): Iris and Sodium, first the own pack, then another one
          if [ "$GROUP" = "shader" ] && ls run-mods/*.jar > /dev/null 2>&1; then
            export NIGHTSIEGE_WITH_IRIS=1
            export NIGHTSIEGE_SHADERPACKS="NightSiege-Photon.zip;$(ls -d $PWD/run-shaderpacks/* 2>/dev/null | tr '\n' ';')"
            timeout 2400 xvfb-run -a -s "-screen 0 1280x720x24" gradle runClientGameTest --no-daemon --stacktrace > client-shader-output.txt 2>&1
            echo "exit=$?" >> client-shader-output.txt
            cat client-shader-output.txt >> client-output.txt
            find . -path ./shots -prune -o -name "*shader_*.png" -path "*screenshot*" -print | while read f; do cp "$f" shots/; done
          fi
          ls shots
          python3 - <<'PY'
          import re
          text = open("client-output.txt", encoding="utf-8", errors="replace").read()
          noise = re.compile(r"(ALSA|flite|narrator|Narrator|Suppressed|Realms|SignedJWT|resource path|OpenAL|SoundSystem|Block-attached entity)")
          pat = re.compile(r"(ERROR|Exception|Caused by|Mixin|mixin|Failed|FAILED|nightsiege|Night Siege|gametest|GameTest|screenshot|passed|exit=|BUILD|Iris|Sodium|shader)", re.I)
          lines = [l.rstrip()[:300] for l in text.splitlines() if pat.search(l) and not noise.search(l)]
          # The first exit line is the main run's (the shader run is appended after it).
          first = re.search(r"exit=(\d+)", text)
          ok = bool(first) and first.group(1) == "0"
          print("::notice title=CLIENTTEST::%s" % ("bestanden" if ok else "FEHLGESCHLAGEN"))
          # GitHub shows at most 10 warnings per step: the focused ones (LADDER, SIM) come first,
          # the general client lines get what is left (and CLIENT-TAIL the last one).
          budget = 9
          ladder, seen = [], set()
          for l in text.splitlines():
              if "[Night Siege test] ladder" in l or "besiegers" in l or "Sprengcreeper" in l or "[Night Siege test] tower" in l or "[Night Siege test] summoner" in l or "[Night Siege test] drone" in l or "[Night Siege test] spotter" in l or "[Night Siege test] alchemist" in l or "[Night Siege test] keys" in l or "[Night Siege test] towers" in l or "[Night Siege test] wheel" in l or "[Night Siege test] foes" in l or "[Night Siege test] raid" in l or "[Night Siege test] curse" in l or "[Night Siege test] percent" in l or "[Night Siege test] overhang" in l or "[Night Siege test] boss" in l:
                  at = l.find("[Night Siege")   # "besiegers"/"Sprengcreeper" lines may come without the prefix
                  body = (l[at:] if at >= 0 else l).strip()[:200]
                  if body not in seen:
                      seen.add(body)
                      ladder.append(body)
          for n in range(0, len(ladder), 20):
              if budget > 1:
                  print("::warning title=LADDER%d::" % (n // 20 + 1) + "%0A".join(ladder[n:n + 20]))
                  budget -= 1
          sim, seen = [], set()
          for l in text.splitlines():
              if "[Night Siege sim]" not in l or "running" in l:
                  continue
              body = l[l.index("[Night Siege sim]") + 17:].strip()[:200]
              if body and body not in seen:
                  seen.add(body)
                  sim.append(body)
          for n in range(0, len(sim), 20):
              if budget > 1:
                  print("::warning title=SIM%d::" % (n // 20 + 1) + "%0A".join(sim[n:n + 20]))
                  budget -= 1
          chunk, size, part = [], 0, 1
          for line in lines[:200]:
              if size + len(line) > 3800:
                  if budget > 0:
                      print("::warning title=CLIENT%d::" % part + "%0A".join(chunk))
                      budget -= 1
                  chunk, size, part = [], 0, part + 1
              chunk.append(line)
              size += len(line) + 1
          if chunk and budget > 0:
              print("::warning title=CLIENT%d::" % part + "%0A".join(chunk))
              budget -= 1
          tail = [l.rstrip()[:300] for l in text.splitlines() if not noise.search(l)][-40:]
          print("::warning title=CLIENT-TAIL::" + "%0A".join(tail))
          PY

      - name: Jar hochladen
        if: always() && strategy.job-index == 0
        uses: actions/upload-artifact@v4
        with:
          name: nightsiege-jar
          path: build/libs/*.jar
          if-no-files-found: warn

      # Artefakte liegen auf einem Speicher, den die Entwicklungsumgebung nicht
      # erreicht. Dateiinhalte aus einem Branch liefert die GitHub-API dagegen
      # direkt aus, deshalb wandert die fertige Jar in den Branch "dist". Since 05.11.
      # every runner hands its part to the job "collect", which pushes one dist branch.
      - name: Ergebnis dieses Teils sammeln
        if: steps.build.outcome == 'success'
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -e
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "gefunden: $JAR"
          TMP=part
          mkdir -p "$TMP/shots"
          printf '%s' "$GROUP" > "$TMP/group.txt"
          echo "${{ strategy.job-index }}" > "$TMP/index.txt"
          cp "$JAR" "$TMP/nightsiege.jar"
          cp api.txt "$TMP/api.txt" 2>/dev/null || true
          cp vanilla.zip "$TMP/vanilla.zip" 2>/dev/null || true
          cp shots/*.png "$TMP/shots/" 2>/dev/null || true
          # Haupt-Protokoll des Client-Tests (ohne Mixin-Audit) fuer die Fehlersuche
          if [ -f client-main-output.txt ]; then
            grep -v "Force-loading class\|ALSA\|narrator" client-main-output.txt | tail -c 3000000 > "$TMP/client-main-log.txt" || true
          fi
          # Server-Probelauf (ohne die Vanilla-Meldungen ueber Bild-Entities) fuer die Fehlersuche
          if [ -f server-output.txt ]; then
            grep -v "Block-attached entity" server-output.txt | tail -c 1500000 > "$TMP/server-log.txt" || true
          fi
          # Shader-Protokoll (ohne Mixin-Audit) fuer die Fehlersuche
          if [ -f client-shader-output.txt ]; then
            grep -v "Force-loading class\|ALSA\|narrator" client-shader-output.txt | tail -c 2000000 > "$TMP/client-shader-log.txt" || true
          fi
          # The dungeon dump of the scene "dungeondump" (every block of the eight dungeons)
          DUMP=$(find . -name "nightsiege-dungeon-dump.txt.gz" -newer build.gradle -not -path "./part/*" 2>/dev/null | head -1)
          if [ -n "$DUMP" ]; then cp "$DUMP" "$TMP/nightsiege-dungeon-dump.txt.gz"; fi
          # Simulation and test-bench lines (and errors) of the client test, for the evaluation
          if [ -f client-output.txt ] && grep -q "\[Night Siege sim\]" client-output.txt; then
            grep "\[Night Siege sim\]\|Exception\|Caused by" client-output.txt | tail -c 2000000 > "$TMP/sim-log.txt" || true
          fi
          # Did the client test pass (first exit line)?
          if [ -f client-output.txt ]; then grep -m1 -o "exit=[0-9]*" client-output.txt > "$TMP/exit.txt" || true; fi

      - name: Teil weitergeben
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: distpart-${{ strategy.job-index }}
          path: part
          retention-days: 1
          if-no-files-found: error

      - name: Ergebnis weiterreichen
        if: steps.build.outcome == 'failure'
        run: exit 1

  # One dist branch for the whole run, as before the split: the jar, all pictures, the logs one after
  # the other (each part under its own heading).
  collect:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: distpart-*
          path: parts

      - name: Zusammenfuehren und in den dist-Branch
        env:
          SLUG: ${{ needs.plan.outputs.slug }}
        run: |
          set -e
          ls parts || { echo "keine Teile"; exit 0; }
          python3 - <<'PY'
          import glob, os, shutil
          parts = []
          for d in glob.glob("parts/distpart-*"):
              idx = int(open(os.path.join(d, "index.txt")).read().strip() or 0) if os.path.exists(os.path.join(d, "index.txt")) else 0
              group = open(os.path.join(d, "group.txt")).read().strip() if os.path.exists(os.path.join(d, "group.txt")) else d
              parts.append((idx, group, d))
          parts.sort()
          out = "out/dist"
          os.makedirs(out + "/shots", exist_ok=True)
          for name in ("nightsiege.jar", "api.txt", "vanilla.zip", "nightsiege-dungeon-dump.txt.gz"):
              for _, _, d in parts:
                  if os.path.exists(os.path.join(d, name)):
                      shutil.copy(os.path.join(d, name), os.path.join(out, name))
                      break
          for log in ("client-main-log.txt", "client-shader-log.txt", "server-log.txt", "sim-log.txt"):
              chunks = []
              for _, group, d in parts:
                  f = os.path.join(d, log)
                  if os.path.exists(f):
                      chunks.append("===== Teil %s =====\n" % group + open(f, encoding="utf-8", errors="replace").read())
              if chunks:
                  open(os.path.join(out, log), "w", encoding="utf-8").write("\n".join(chunks))
          seen = set()
          for idx, group, d in parts:
              for f in sorted(glob.glob(os.path.join(d, "shots", "*.png"))):
                  name = os.path.basename(f)
                  if name in seen:
                      name = "t%d_%s" % (idx, name)
                  seen.add(name)
                  shutil.copy(f, os.path.join(out, "shots", name))
          lines = []
          for idx, group, d in parts:
              ex = open(os.path.join(d, "exit.txt")).read().strip() if os.path.exists(os.path.join(d, "exit.txt")) else "-"
              lines.append("%s\t%s" % (group, ex))
          open(os.path.join(out, "parts.txt"), "w").write("\n".join(lines) + "\n")
          print("::notice title=TEILE::" + " | ".join(lines))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dist-tmp
          git reset --hard
          rm -rf dist
          cp -r out/dist dist
          git add -f dist
          git commit -m "Build von ${GITHUB_SHA}"
          # main fills "dist"; a work branch (version-b, ...) its own "dist-<branch>",
          # and a run of single scenes "dist-<branch>-<scenes>" (04.11.).
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "main" ]; then TARGET=dist; else TARGET="dist-${BRANCH}"; fi
          if [ -n "$SLUG" ]; then TARGET="${TARGET}-${SLUG}"; fi
          echo "dist-tmp -> $TARGET"
          for i in 1 2 3 4 5; do
            if git push -f origin dist-tmp:$TARGET; then break; fi
            if [ "$i" = 5 ]; then exit 1; fi
            sleep $((i * 7))
          done

      - name: Ergebnis weiterreichen
        if: needs.build.result == 'failure'
        run: exit 1
