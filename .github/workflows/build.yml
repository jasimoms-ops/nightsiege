name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Der Runner hat vollen Netzzugang. Diese Angaben sind von der
      # Entwicklungsumgebung aus nicht erreichbar, deshalb werden sie hier
      # ermittelt und als Annotation ausgegeben.
      - name: Verfuegbare Fabric-Versionen melden
        if: always()
        run: |
          python3 - <<'PY'
          import json, urllib.request, re
          def get(url):
              try:
                  return urllib.request.urlopen(url, timeout=30).read().decode()
              except Exception as e:
                  return "FEHLER %s: %s" % (url, e)
          out = []
          try:
              games = json.loads(get("https://meta.fabricmc.net/v2/versions/game"))
              out.append("MC stabil: " + ", ".join(g["version"] for g in games if g.get("stable"))[:300])
              out.append("MC neueste: " + ", ".join(g["version"] for g in games[:8]))
          except Exception as e:
              out.append("game-API: %s" % e)
          try:
              loaders = json.loads(get("https://meta.fabricmc.net/v2/versions/loader"))
              out.append("Loader: " + ", ".join(l["version"] for l in loaders[:5]))
          except Exception as e:
              out.append("loader-API: %s" % e)
          for name, url in [
              ("fabric-api", "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml"),
              ("fabric-loom", "https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml"),
          ]:
              xml = get(url)
              vs = re.findall(r"<version>([^<]+)</version>", xml)
              out.append("%s: %s" % (name, ", ".join(vs[-12:]) if vs else xml[:200]))
          print("::error title=VERSIONEN::" + "%0A".join(out))
          PY

      # fabric-api und Loader aendern sich staendig. Statt sie zu raten, wird
      # hier die jeweils neueste zur eingestellten Minecraft-Version passende
      # Fassung ermittelt und in gradle.properties eingetragen.
      - name: Passende Abhaengigkeiten waehlen
        run: |
          python3 - <<'PY'
          import json, re, urllib.request

          props = {}
          for line in open("gradle.properties", encoding="utf-8"):
              if "=" in line and not line.strip().startswith("#"):
                  k, v = line.split("=", 1)
                  props[k.strip()] = v.strip()
          mc = props["minecraft_version"]

          xml = urllib.request.urlopen(
              "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml",
              timeout=30).read().decode()
          api = [v for v in re.findall(r"<version>([^<]+)</version>", xml) if v.endswith("+" + mc)]
          if not api:
              print("::error title=KEINE-API::fabric-api hat keine Fassung fuer %s%%0AVerfuegbar: %s"
                    % (mc, ", ".join(re.findall(r"<version>([^<]+)</version>", xml)[-40:])))
              raise SystemExit(1)

          loaders = json.loads(urllib.request.urlopen(
              "https://meta.fabricmc.net/v2/versions/loader", timeout=30).read().decode())
          loader = loaders[0]["version"]

          text = open("gradle.properties", encoding="utf-8").read()
          text = re.sub(r"(?m)^fabric_version=.*$", "fabric_version=" + api[-1], text)
          text = re.sub(r"(?m)^loader_version=.*$", "loader_version=" + loader, text)
          open("gradle.properties", "w", encoding="utf-8").write(text)
          print("::notice title=GEWAEHLT::mc=%s api=%s loader=%s" % (mc, api[-1], loader))
          PY

      - name: JDK 25 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Bauen
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build-output.txt

      # Die Rohprotokolle liegen auf einem Speicher, den die Entwicklungsumgebung
      # nicht erreicht. Die wichtigen Zeilen gehen daher als Annotation raus.
      - name: Fehler als Annotation melden
        if: always()
        run: |
          python3 - <<'PY'
          import re, os
          try:
              text = open("build-output.txt", encoding="utf-8", errors="replace").read()
          except FileNotFoundError:
              print("::error title=BUILD::build-output.txt fehlt")
              raise SystemExit(0)
          pat = re.compile(r"(error:|warning:|FAILURE|What went wrong|Caused by|Could not|Execution failed|^\s*>|\.java:\d+)", re.M)
          lines = [l.rstrip() for l in text.splitlines() if pat.search(l)]
          if not lines:
              lines = text.splitlines()[-80:]
          chunk, size, part = [], 0, 1
          for line in lines[-250:]:
              if size + len(line) > 7000:
                  print("::error title=BUILD%d::" % part + "%0A".join(chunk))
                  chunk, size, part = [], 0, part + 1
              chunk.append(line)
              size += len(line) + 1
          if chunk:
              print("::error title=BUILD%d::" % part + "%0A".join(chunk))
          PY

      - name: Jar hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightsiege-jar
          path: build/libs/*.jar
          if-no-files-found: warn

      - name: Ergebnis weiterreichen
        if: steps.build.outcome == 'failure'
        run: exit 1
