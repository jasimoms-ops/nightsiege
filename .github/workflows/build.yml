name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # fabric-api und Loader aendern sich staendig. Statt sie zu raten, wird
      # hier die jeweils neueste zur eingestellten Minecraft-Version passende
      # Fassung ermittelt und in gradle.properties eingetragen.
      - name: Passende Abhaengigkeiten waehlen
        run: |
          python3 - <<'PY'
          import json, re, urllib.request

          props = {}
          for line in open("gradle.properties", encoding="utf-8"):
              if "=" in line and not line.strip().startswith("#"):
                  k, v = line.split("=", 1)
                  props[k.strip()] = v.strip()
          mc = props["minecraft_version"]

          xml = urllib.request.urlopen(
              "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml",
              timeout=30).read().decode()
          api = [v for v in re.findall(r"<version>([^<]+)</version>", xml) if v.endswith("+" + mc)]
          if not api:
              print("::error title=KEINE-API::fabric-api hat keine Fassung fuer %s%%0AVerfuegbar: %s"
                    % (mc, ", ".join(re.findall(r"<version>([^<]+)</version>", xml)[-40:])))
              raise SystemExit(1)

          loaders = json.loads(urllib.request.urlopen(
              "https://meta.fabricmc.net/v2/versions/loader", timeout=30).read().decode())
          loader = loaders[0]["version"]

          text = open("gradle.properties", encoding="utf-8").read()
          text = re.sub(r"(?m)^fabric_version=.*$", "fabric_version=" + api[-1], text)
          text = re.sub(r"(?m)^loader_version=.*$", "loader_version=" + loader, text)
          open("gradle.properties", "w", encoding="utf-8").write(text)
          print("::notice title=GEWAEHLT::mc=%s api=%s loader=%s" % (mc, api[-1], loader))
          PY

      - name: JDK 25 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Bauen
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build-output.txt

      # Die Rohprotokolle liegen auf einem Speicher, den die Entwicklungsumgebung
      # nicht erreicht. Die wichtigen Zeilen gehen daher als Annotation raus.
      - name: Fehler als Annotation melden
        if: always()
        run: |
          python3 - <<'PY'
          import re, os
          try:
              text = open("build-output.txt", encoding="utf-8", errors="replace").read()
          except FileNotFoundError:
              print("::error title=BUILD::build-output.txt fehlt")
              raise SystemExit(0)
          pat = re.compile(r"(PROBE:|error:|warning:|FAILURE|What went wrong|Caused by|Could not|Execution failed|^\s*>|\.java:\d+)", re.M)
          lines = [l.rstrip() for l in text.splitlines() if pat.search(l)]
          if not lines:
              lines = text.splitlines()[-80:]
          chunk, size, part = [], 0, 1
          for line in lines[-250:]:
              if size + len(line) > 7000:
                  print("::error title=BUILD%d::" % part + "%0A".join(chunk))
                  chunk, size, part = [], 0, part + 1
              chunk.append(line)
              size += len(line) + 1
          if chunk:
              print("::error title=BUILD%d::" % part + "%0A".join(chunk))
          PY

      # Probe-Ausgaben (Zeilen mit PROBE:) sind oft laenger als eine Annotation
      # fasst. Sie wandern deshalb vollstaendig als Datei in den Branch "probe".
      - name: Probe-Ausgabe bereitstellen
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          grep -h "PROBE:" build-output.txt > "$RUNNER_TEMP/probe.txt" 2>/dev/null || true
          if [ ! -s "$RUNNER_TEMP/probe.txt" ]; then echo "keine Probe-Ausgabe"; exit 0; fi
          DIR=$(mktemp -d)
          cp "$RUNNER_TEMP/probe.txt" "$DIR/probe.txt"
          cd "$DIR"
          git init -q -b probe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe.txt
          git commit -q -m "Probe von ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" probe:probe

      # Ein echter Serverstart deckt Fehler auf, die der Compiler nicht sieht:
      # Registrierung, Rezepte, Tags, Weltgenerierung. Nach einigen Minuten
      # wird der Server einfach beendet.
      - name: Server-Probelauf
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "level-seed=nightsiege\nonline-mode=false\n" > run/server.properties
          timeout 420 gradle runServer --no-daemon --args=nogui > server-output.txt 2>&1 || true
          python3 - <<'PY'
          import re
          text = open("server-output.txt", encoding="utf-8", errors="replace").read()
          pat = re.compile(r"(ERROR|Exception|Caused by|Failed|Couldn't|Unknown|Night Siege|Done \(|Missing|Invalid|nightsiege)", re.I)
          lines = [l.rstrip()[:400] for l in text.splitlines() if pat.search(l)]
          started = any("Done (" in l for l in lines)
          print("::notice title=SERVERSTART::%s" % ("ok" if started else "NICHT gestartet"))
          chunk, size, part = [], 0, 1
          for line in lines[:120]:
              if size + len(line) > 7000:
                  print("::warning title=SERVER%d::" % part + "%0A".join(chunk))
                  chunk, size, part = [], 0, part + 1
              chunk.append(line)
              size += len(line) + 1
          if chunk:
              print("::warning title=SERVER%d::" % part + "%0A".join(chunk))
          if not lines:
              print("::warning title=SERVER-TAIL::" + "%0A".join(text.splitlines()[-40:]))
          PY

      # Client-Mixins (Himmel, Blutmond) greifen nur im echten Client. Er startet
      # hier ohne Bildschirm mit Software-OpenGL bis zum Titelbild; die Mod meldet
      # dabei im Log, ob ihre Eingriffe ins Rendering angekommen sind.
      - name: Client-Probelauf
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          sudo apt-get update -qq > /dev/null 2>&1 || true
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 > /dev/null 2>&1 || true
          mkdir -p run
          export LIBGL_ALWAYS_SOFTWARE=1
          ( xvfb-run -a -s "-screen 0 1280x720x24" gradle runClient --no-daemon > client-output.txt 2>&1 ) &
          PID=$!
          for i in $(seq 1 120); do
            sleep 5
            if grep -q -E "Blutmond-Himmel|Minecraft has crashed|Game crashed|BUILD FAILED" client-output.txt 2>/dev/null; then
              sleep 10
              break
            fi
          done
          pkill -f "net.fabricmc.devlaunchinjector" || true
          pkill -f "KnotClient" || true
          pkill -f "xvfb-run" || true
          kill $PID 2>/dev/null || true
          python3 - <<'PY'
          import re
          text = open("client-output.txt", encoding="utf-8", errors="replace").read()
          pat = re.compile(r"(ERROR|Exception|Caused by|[Mm]ixin|Night Siege|nightsiege|Backend library|OpenGL|GL_|crash|FAILED)")
          lines = [l.rstrip()[:400] for l in text.splitlines() if pat.search(l)]
          ok = any("Blutmond-Himmel: Mond ok, Farben ok" in l for l in lines)
          print("::notice title=CLIENTSTART::%s" % ("Mixins ok" if ok else "Mixins NICHT bestaetigt"))
          chunk, size, part = [], 0, 1
          for line in lines[:150]:
              if size + len(line) > 3800:
                  print("::warning title=CLIENT%d::" % part + "%0A".join(chunk))
                  chunk, size, part = [], 0, part + 1
              chunk.append(line)
              size += len(line) + 1
          if chunk:
              print("::warning title=CLIENT%d::" % part + "%0A".join(chunk))
          if not lines:
              print("::warning title=CLIENT-TAIL::" + "%0A".join(text.splitlines()[-40:]))
          PY

      # Das vollstaendige Client-Protokoll wandert in den Branch "probe-client".
      - name: Client-Protokoll bereitstellen
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ ! -s client-output.txt ]; then echo "kein Client-Protokoll"; exit 0; fi
          DIR=$(mktemp -d)
          tail -c 3000000 client-output.txt > "$DIR/client.txt"
          if ls run/screenshots/*.png > /dev/null 2>&1; then mkdir -p "$DIR/screenshots"; cp run/screenshots/*.png "$DIR/screenshots/"; fi
          cd "$DIR"
          git init -q -b probe-client
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Client-Protokoll von ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" probe-client:probe-client

      - name: Jar hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightsiege-jar
          path: build/libs/*.jar
          if-no-files-found: warn

      # Artefakte liegen auf einem Speicher, den die Entwicklungsumgebung nicht
      # erreicht. Dateiinhalte aus einem Branch liefert die GitHub-API dagegen
      # direkt aus, deshalb wandert die fertige Jar in den Branch "dist".
      - name: Jar im dist-Branch bereitstellen
        if: steps.build.outcome == 'success'
        run: |
          set -e
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "gefunden: $JAR"
          TMP=$(mktemp -d)
          cp "$JAR" "$TMP/nightsiege.jar"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dist-tmp
          git reset --hard
          mkdir -p dist
          cp "$TMP/nightsiege.jar" dist/nightsiege.jar
          git add -f dist/nightsiege.jar
          git commit -m "Build von ${GITHUB_SHA}"
          git push -f origin dist-tmp:dist

      - name: Ergebnis weiterreichen
        if: steps.build.outcome == 'failure'
        run: exit 1
