name: build

on:
  push:
    branches: [main, 'version-*']
  workflow_dispatch:
    inputs:
      quick:
        description: 'Nur bauen und API-Auszug, ohne Server- und Client-Test'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # fabric-api und Loader aendern sich staendig. Statt sie zu raten, wird
      # hier die jeweils neueste zur eingestellten Minecraft-Version passende
      # Fassung ermittelt und in gradle.properties eingetragen.
      - name: Passende Abhaengigkeiten waehlen
        run: |
          python3 - <<'PY'
          import json, re, urllib.request

          props = {}
          for line in open("gradle.properties", encoding="utf-8"):
              if "=" in line and not line.strip().startswith("#"):
                  k, v = line.split("=", 1)
                  props[k.strip()] = v.strip()
          mc = props["minecraft_version"]

          xml = urllib.request.urlopen(
              "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml",
              timeout=30).read().decode()
          api = [v for v in re.findall(r"<version>([^<]+)</version>", xml) if v.endswith("+" + mc)]
          if not api:
              print("::error title=KEINE-API::fabric-api hat keine Fassung fuer %s%%0AVerfuegbar: %s"
                    % (mc, ", ".join(re.findall(r"<version>([^<]+)</version>", xml)[-40:])))
              raise SystemExit(1)

          loaders = json.loads(urllib.request.urlopen(
              "https://meta.fabricmc.net/v2/versions/loader", timeout=30).read().decode())
          loader = loaders[0]["version"]

          text = open("gradle.properties", encoding="utf-8").read()
          text = re.sub(r"(?m)^fabric_version=.*$", "fabric_version=" + api[-1], text)
          text = re.sub(r"(?m)^loader_version=.*$", "loader_version=" + loader, text)
          open("gradle.properties", "w", encoding="utf-8").write(text)
          print("::notice title=GEWAEHLT::mc=%s api=%s loader=%s" % (mc, api[-1], loader))
          PY

      # Fuer den Shader-Test: Iris, Sodium und ein fremdes Shader-Pack von Modrinth
      # (das eigene Night-Siege-Pack legt die Mod selbst in den shaderpacks-Ordner).
      - name: Shader-Testmaterial laden
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "nightsiege-ci"})
              return urllib.request.urlopen(req, timeout=60).read()
          os.makedirs("run-mods", exist_ok=True)
          os.makedirs("run-shaderpacks", exist_ok=True)
          mc = [l.split("=",1)[1].strip() for l in open("gradle.properties") if l.startswith("minecraft_version")][0]
          for slug in ("sodium", "iris"):
              q = urllib.parse.urlencode({"game_versions": json.dumps([mc]), "loaders": json.dumps(["fabric"])})
              versions = json.loads(get("https://api.modrinth.com/v2/project/%s/version?%s" % (slug, q)))
              if not versions:
                  print("::warning title=SHADERTEST::keine %s-Fassung fuer %s" % (slug, mc)); continue
              f = [x for x in versions[0]["files"] if x.get("primary")] or versions[0]["files"]
              open("run-mods/" + f[0]["filename"], "wb").write(get(f[0]["url"]))
              print("::notice title=SHADERTEST::%s %s" % (slug, versions[0]["version_number"]))
          for query in ("complementary reimagined",):
              hits = json.loads(get("https://api.modrinth.com/v2/search?" + urllib.parse.urlencode(
                  {"query": query, "facets": json.dumps([["project_type:shader"]]), "limit": 3})))["hits"]
              if not hits:
                  print("::warning title=SHADERTEST::kein Pack fuer %s" % query); continue
              slug = hits[0]["slug"]
              versions = json.loads(get("https://api.modrinth.com/v2/project/%s/version" % slug))
              f = [x for x in versions[0]["files"] if x.get("primary")] or versions[0]["files"]
              open("run-shaderpacks/" + f[0]["filename"], "wb").write(get(f[0]["url"]))
              print("::notice title=SHADERTEST::Pack %s %s" % (slug, f[0]["filename"]))
          PY

      # Die Dungeons stecken in den Strukturen von "Dungeons and Taverns". Die Mod
      # laeuft in allen Testlaeufen mit; eine Kopie geht zum Nachsehen in den dist-Branch.
      - name: Dungeon-Strukturen laden
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "nightsiege-ci"})
              return urllib.request.urlopen(req, timeout=60).read()
          os.makedirs("dungeon-mods", exist_ok=True)
          mc = [l.split("=",1)[1].strip() for l in open("gradle.properties") if l.startswith("minecraft_version")][0]
          q = urllib.parse.urlencode({"game_versions": json.dumps([mc]), "loaders": json.dumps(["fabric"])})
          versions = json.loads(get("https://api.modrinth.com/v2/project/dungeons-and-taverns/version?" + q))
          if not versions:
              print("::warning title=DUNGEONS::keine Dungeons-and-Taverns-Fassung fuer %s" % mc)
          else:
              f = [x for x in versions[0]["files"] if x.get("primary")] or versions[0]["files"]
              open("dungeon-mods/" + f[0]["filename"], "wb").write(get(f[0]["url"]))
              print("::notice title=DUNGEONS::%s %s" % (versions[0]["version_number"], f[0]["filename"]))
              # Required libraries of the mod (fabric-api is there already).
              for dep in versions[0].get("dependencies", []):
                  if dep.get("dependency_type") != "required" or not dep.get("project_id"):
                      continue
                  project = json.loads(get("https://api.modrinth.com/v2/project/" + dep["project_id"]))
                  if project.get("slug") == "fabric-api":
                      continue
                  dv = json.loads(get("https://api.modrinth.com/v2/project/%s/version?%s" % (dep["project_id"], q)))
                  if not dv:
                      print("::warning title=DUNGEONS::Abhaengigkeit %s fehlt fuer %s" % (project.get("slug"), mc)); continue
                  df = [x for x in dv[0]["files"] if x.get("primary")] or dv[0]["files"]
                  open("dungeon-mods/" + df[0]["filename"], "wb").write(get(df[0]["url"]))
                  print("::notice title=DUNGEONS::braucht %s %s" % (project.get("slug"), dv[0]["version_number"]))
          PY

      - name: JDK 25 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Bauen
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build-output.txt

      # Signaturen ausgewaehlter Minecraft-Klassen (javap) fuer die Entwicklung:
      # die Entwicklungsumgebung hat keine Minecraft-Quellen.
      - name: API-Auszug
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import glob, os, subprocess, zipfile
          want = [l.strip() for l in open("tools/api-classes.txt") if l.strip() and not l.startswith("#")] if os.path.exists("tools/api-classes.txt") else []
          jars = [j for j in glob.glob(os.path.expanduser("~/.gradle/caches/**/*.jar"), recursive=True) + glob.glob(".gradle/**/*.jar", recursive=True)
                  if "minecraft" in os.path.basename(j).lower()]
          found = None
          for j in jars:
              try:
                  if "net/minecraft/world/level/levelgen/structure/StructureStart.class" in zipfile.ZipFile(j).namelist():
                      found = j; break
              except Exception:
                  pass
          out = open("api.txt", "w")
          out.write("jar: %s\n" % found)
          if found:
              names = zipfile.ZipFile(found).namelist()
              for w in want:
                  if w.endswith("*"):
                      hits = [n[:-6].replace("/", ".") for n in names if n.endswith(".class") and n.startswith(w[:-1].replace(".", "/")) and "$" not in n]
                  else:
                      hits = [w]
                  for cls in hits[:40]:
                      r = subprocess.run(["javap", "-p", "-cp", found, cls], capture_output=True, text=True)
                      out.write(r.stdout or r.stderr)
                      out.write("\n")
          out.close()
          print("::notice title=API::%s" % found)
          PY

      # Die Rohprotokolle liegen auf einem Speicher, den die Entwicklungsumgebung
      # nicht erreicht. Die wichtigen Zeilen gehen daher als Annotation raus.
      - name: Fehler als Annotation melden
        if: always()
        run: |
          python3 - <<'PY'
          import re, os
          try:
              text = open("build-output.txt", encoding="utf-8", errors="replace").read()
          except FileNotFoundError:
              print("::error title=BUILD::build-output.txt fehlt")
              raise SystemExit(0)
          pat = re.compile(r"(PROBE:|error:|warning:|FAILURE|What went wrong|Caused by|Could not|Execution failed|^\s*>|\.java:\d+)", re.M)
          lines = [l.rstrip() for l in text.splitlines() if pat.search(l)]
          if not lines:
              lines = text.splitlines()[-80:]
          chunk, size, part = [], 0, 1
          for line in lines[-250:]:
              if size + len(line) > 7000:
                  print("::error title=BUILD%d::" % part + "%0A".join(chunk))
                  chunk, size, part = [], 0, part + 1
              chunk.append(line)
              size += len(line) + 1
          if chunk:
              print("::error title=BUILD%d::" % part + "%0A".join(chunk))
          PY

      # Ein echter Serverstart deckt Fehler auf, die der Compiler nicht sieht:
      # Registrierung, Rezepte, Tags, Weltgenerierung. Nach einigen Minuten
      # wird der Server einfach beendet.
      - name: Server-Probelauf
        if: steps.build.outcome == 'success' && !inputs.quick
        continue-on-error: true
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "level-seed=nightsiege\nonline-mode=false\n" > run/server.properties
          NIGHTSIEGE_DUNGEON_PROBE=1 timeout 600 gradle runServer --no-daemon --args=nogui > server-output.txt 2>&1 || true
          python3 - <<'PY'
          import re
          text = open("server-output.txt", encoding="utf-8", errors="replace").read()
          pat = re.compile(r"(ERROR|Exception|Caused by|Failed|Couldn't|Unknown|Night Siege|Done \(|Missing|Invalid|nightsiege)", re.I)
          lines = [l.rstrip()[:400] for l in text.splitlines() if pat.search(l)]
          started = any("Done (" in l for l in lines)
          print("::notice title=SERVERSTART::%s" % ("ok" if started else "NICHT gestartet"))
          chunk, size, part = [], 0, 1
          for line in lines[:120]:
              if size + len(line) > 7000:
                  print("::warning title=SERVER%d::" % part + "%0A".join(chunk))
                  chunk, size, part = [], 0, part + 1
              chunk.append(line)
              size += len(line) + 1
          if chunk:
              print("::warning title=SERVER%d::" % part + "%0A".join(chunk))
          if not lines:
              print("::warning title=SERVER-TAIL::" + "%0A".join(text.splitlines()[-40:]))
          PY

      # Ein echter Client-Start (Fabric Client-Gametest, Software-Grafik) laedt
      # eine Welt, prueft alle Mixins und fotografiert jedes Ereignis. Die Bilder
      # wandern mit der Jar in den dist-Branch.
      - name: Client-Test
        if: steps.build.outcome == 'success' && !inputs.quick
        continue-on-error: true
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set +e
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1
          CLIENT_TIMEOUT=1200
          # [sim] in the commit message: only the melee balance simulation, with more time.
          if [[ "$COMMIT_MSG" == *"[sim"* ]]; then
            SIMARG=$(printf '%s' "$COMMIT_MSG" | grep -o '\[sim[^]]*\]' | head -1 | sed 's/^\[sim//; s/\]$//')
            export NIGHTSIEGE_SIM="1 $SIMARG"
            CLIENT_TIMEOUT=12000
          fi
          timeout $CLIENT_TIMEOUT xvfb-run -a -s "-screen 0 1280x720x24" gradle runClientGameTest --no-daemon --stacktrace > client-output.txt 2>&1
          echo "exit=$?" >> client-output.txt
          mkdir -p shots
          find . -path ./shots -prune -o -name "*.png" -path "*screenshot*" -newer build.gradle -print | while read f; do cp "$f" shots/; done
          # Zweiter Lauf mit Iris und Sodium: zuerst das eigene Pack, dann ein fremdes
          if ls run-mods/*.jar > /dev/null 2>&1 && [[ "$COMMIT_MSG" != *"[noshader]"* ]]; then
            export NIGHTSIEGE_WITH_IRIS=1
            export NIGHTSIEGE_SHADERPACKS="NightSiege-Photon.zip;$(ls -d $PWD/run-shaderpacks/* 2>/dev/null | tr '\n' ';')"
            timeout 2400 xvfb-run -a -s "-screen 0 1280x720x24" gradle runClientGameTest --no-daemon --stacktrace > client-shader-output.txt 2>&1
            echo "exit=$?" >> client-shader-output.txt
            cat client-shader-output.txt >> client-output.txt
            find . -path ./shots -prune -o -name "*shader_*.png" -path "*screenshot*" -print | while read f; do cp "$f" shots/; done
          fi
          ls shots
          python3 - <<'PY'
          import re
          text = open("client-output.txt", encoding="utf-8", errors="replace").read()
          noise = re.compile(r"(ALSA|flite|narrator|Narrator|Suppressed|Realms|SignedJWT|resource path|OpenAL|SoundSystem|Block-attached entity)")
          pat = re.compile(r"(ERROR|Exception|Caused by|Mixin|mixin|Failed|FAILED|nightsiege|Night Siege|gametest|GameTest|screenshot|passed|exit=|BUILD|Iris|Sodium|shader)", re.I)
          lines = [l.rstrip()[:300] for l in text.splitlines() if pat.search(l) and not noise.search(l)]
          ok = text.count("exit=0") >= 1
          print("::notice title=CLIENTTEST::%s" % ("bestanden" if ok else "FEHLGESCHLAGEN"))
          # GitHub shows at most 10 warnings per step: the focused ones (LADDER, SIM) come first,
          # the general client lines get what is left (and CLIENT-TAIL the last one).
          budget = 9
          ladder, seen = [], set()
          for l in text.splitlines():
              if "[Night Siege test] ladder" in l or "besiegers" in l or "Sprengcreeper" in l or "[Night Siege test] tower" in l or "[Night Siege test] summoner" in l:
                  body = l[l.index("[Night Siege"):].strip()[:200]
                  if body not in seen:
                      seen.add(body)
                      ladder.append(body)
          for n in range(0, len(ladder), 20):
              if budget > 1:
                  print("::warning title=LADDER%d::" % (n // 20 + 1) + "%0A".join(ladder[n:n + 20]))
                  budget -= 1
          sim, seen = [], set()
          for l in text.splitlines():
              if "[Night Siege sim]" not in l or "running" in l:
                  continue
              body = l[l.index("[Night Siege sim]") + 17:].strip()[:200]
              if body and body not in seen:
                  seen.add(body)
                  sim.append(body)
          for n in range(0, len(sim), 20):
              if budget > 1:
                  print("::warning title=SIM%d::" % (n // 20 + 1) + "%0A".join(sim[n:n + 20]))
                  budget -= 1
          chunk, size, part = [], 0, 1
          for line in lines[:200]:
              if size + len(line) > 3800:
                  if budget > 0:
                      print("::warning title=CLIENT%d::" % part + "%0A".join(chunk))
                      budget -= 1
                  chunk, size, part = [], 0, part + 1
              chunk.append(line)
              size += len(line) + 1
          if chunk and budget > 0:
              print("::warning title=CLIENT%d::" % part + "%0A".join(chunk))
              budget -= 1
          tail = [l.rstrip()[:300] for l in text.splitlines() if not noise.search(l)][-40:]
          print("::warning title=CLIENT-TAIL::" + "%0A".join(tail))
          PY

      - name: Jar hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightsiege-jar
          path: build/libs/*.jar
          if-no-files-found: warn

      # Artefakte liegen auf einem Speicher, den die Entwicklungsumgebung nicht
      # erreicht. Dateiinhalte aus einem Branch liefert die GitHub-API dagegen
      # direkt aus, deshalb wandert die fertige Jar in den Branch "dist".
      - name: Jar im dist-Branch bereitstellen
        if: steps.build.outcome == 'success'
        run: |
          set -e
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "gefunden: $JAR"
          TMP=$(mktemp -d)
          cp "$JAR" "$TMP/nightsiege.jar"
          cp api.txt "$TMP/api.txt" 2>/dev/null || true
          mkdir -p "$TMP/dungeon-mods"
          cp dungeon-mods/*.jar "$TMP/dungeon-mods/" 2>/dev/null || true
          mkdir -p "$TMP/shots"
          cp shots/*.png "$TMP/shots/" 2>/dev/null || true
          # Shader-Protokoll (ohne Mixin-Audit) fuer die Fehlersuche
          if [ -f client-shader-output.txt ]; then
            grep -v "Force-loading class\|ALSA\|narrator" client-shader-output.txt | tail -c 2000000 > "$TMP/client-shader-log.txt" || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dist-tmp
          git reset --hard
          mkdir -p dist
          cp "$TMP/nightsiege.jar" dist/nightsiege.jar
          git add -f dist/nightsiege.jar
          if [ -f "$TMP/api.txt" ]; then cp "$TMP/api.txt" dist/; git add -f dist/api.txt; fi
          if ls "$TMP/dungeon-mods/"*.jar > /dev/null 2>&1; then mkdir -p dist/dungeon-mods; cp "$TMP/dungeon-mods/"*.jar dist/dungeon-mods/; git add -f dist/dungeon-mods; fi
          if ls "$TMP/shots/"*.png > /dev/null 2>&1; then mkdir -p dist/shots; cp "$TMP/shots/"*.png dist/shots/; git add -f dist/shots; fi
          if [ -f "$TMP/client-shader-log.txt" ]; then cp "$TMP/client-shader-log.txt" dist/; git add -f dist/client-shader-log.txt; fi
          git commit -m "Build von ${GITHUB_SHA}"
          # main fills "dist"; a work branch (version-b, ...) its own "dist-<branch>",
          # so the jar of main stays untouched until the branch is merged.
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "main" ]; then TARGET=dist; else TARGET="dist-${BRANCH}"; fi
          git push -f origin dist-tmp:$TARGET

      - name: Ergebnis weiterreichen
        if: steps.build.outcome == 'failure'
        run: exit 1
