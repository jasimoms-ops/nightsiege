name: ref

# Loads reference pictures of another mod (only to look at, never shipped) into a ref-cotl-N branch.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  ref:
    runs-on: ubuntu-latest
    steps:
      - name: Referenzbilder laden
        run: |
          mkdir -p out && cd out
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, zipfile, io, os
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 nightsiege-ref"})
              return urllib.request.urlopen(req, timeout=90).read()
          log = []
          try:
              res = json.loads(get("https://api.modrinth.com/v2/search?" + urllib.parse.urlencode(
                  {"query": "clothing of the lowlands", "limit": 8})))
              for h in res["hits"]:
                  log.append("hit %s | %s" % (h["slug"], h["title"]))
              hit = [h for h in res["hits"] if "lowland" in h["title"].lower()]
              if hit:
                  slug = hit[0]["slug"]
                  proj = json.loads(get("https://api.modrinth.com/v2/project/" + slug))
                  log.append("desc: " + proj.get("description", ""))
                  open("body.md", "w").write(proj.get("body", ""))
                  for i, g in enumerate(proj.get("gallery", [])):
                      ext = g["url"].rsplit(".", 1)[-1][:4]
                      open("gallery_%02d.%s" % (i, ext), "wb").write(get(g["url"]))
                      log.append("gallery %d %s" % (i, g.get("title")))
                  vers = json.loads(get("https://api.modrinth.com/v2/project/%s/version" % slug))
                  f = [x for x in vers[0]["files"] if x.get("primary")] or vers[0]["files"]
                  z = zipfile.ZipFile(io.BytesIO(get(f[0]["url"])))
                  os.makedirs("jar", exist_ok=True)
                  names = z.namelist()
                  open("jar_files.txt", "w").write("\n".join(names))
                  for n in names:
                      if n.endswith(".png") and "/textures/" in n and "/gui/" not in n:
                          open("jar/" + n.replace("/", "__"), "wb").write(z.read(n))
                  log.append("jar %s (%s) files %d" % (f[0]["filename"], vers[0]["version_number"], len(names)))
          except Exception as e:
              log.append("modrinth error %r" % e)
          # CurseForge, through the site's own API.
          try:
              cf = "https://www.curseforge.com/api/v1/mods"
              res = json.loads(get(cf + "/search?" + urllib.parse.urlencode(
                  {"gameId": 432, "classId": 6, "filterText": "clothing of the lowlands", "pageSize": 5, "index": 0})))
              mods = res.get("data", [])
              for m in mods:
                  log.append("cf %s | %s | %s" % (m.get("id"), m.get("slug"), m.get("name")))
              mod = [m for m in mods if "lowland" in (m.get("name") or "").lower()]
              if mod:
                  mid = mod[0]["id"]
                  try:
                      detail = get(cf + "/%s" % mid)
                      open("cf_mod.json", "wb").write(detail)
                  except Exception as e:
                      log.append("cf detail error %r" % e)
                  for key in ("screenshots",):
                      pass
                  try:
                      d = json.loads(open("cf_mod.json").read()).get("data", {})
                      shots = d.get("screenshots") or []
                      for i, sh in enumerate(shots):
                          url = sh.get("url") or sh.get("imageUrl")
                          if url:
                              open("cf_shot_%02d.%s" % (i, url.rsplit(".", 1)[-1][:4]), "wb").write(get(url))
                              log.append("shot %d %s" % (i, sh.get("title")))
                  except Exception as e:
                      log.append("cf shots error %r" % e)
                  files = json.loads(get(cf + "/%s/files?pageIndex=0&pageSize=10&sort=dateCreated&sortDescending=true" % mid))
                  open("cf_files.json", "w").write(json.dumps(files)[:20000])
                  fl = files.get("data", [])
                  if fl:
                      fid = fl[0]["id"]
                      data = get(cf + "/%s/files/%s/download" % (mid, fid))
                      z = zipfile.ZipFile(io.BytesIO(data))
                      names = z.namelist()
                      open("cf_jar_files.txt", "w").write("\n".join(names))
                      os.makedirs("jar", exist_ok=True)
                      for n in names:
                          if n.endswith(".png") and "/textures/" in n and "/gui/" not in n:
                              open("jar/" + n.replace("/", "__"), "wb").write(z.read(n))
                      log.append("cf jar %s files %d" % (fl[0].get("fileName"), len(names)))
          except Exception as e:
              log.append("curseforge error %r" % e)
          open("log.txt", "w").write("\n".join(log) + "\n")
          print("\n".join(log))
          PY
      - name: Vorschauvideo in Bilder zerlegen
        continue-on-error: true
        run: |
          cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) nightsiege-ref"
          curl -sSL -A "$UA" -o thumb.jpg https://www.9minecraft.net/wp-content/uploads/2026/07/Clothing-of-the-Lowlands-Mod-Thumbnail.jpg || true
          curl -sSL -A "$UA" -o poster.jpg https://video3.9minecraft.net/2026/07/936640/poster.jpg || true
          curl -sSL -A "$UA" -o video.mp4 https://video3.9minecraft.net/2026/07/936640/video-720p.mp4 || true
          ls -la
          mkdir -p frames
          ffmpeg -loglevel error -i video.mp4 -vf "fps=1/2,scale=960:-1" -q:v 3 frames/f_%03d.jpg || true
          rm -f video.mp4
          ls frames | wc -l
      - name: In den ref-cotl-Branch legen
        run: |
          cd out
          git init -q
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git checkout -q -b ref-cotl-${{ github.run_number }}
          git add .
          git commit -qm "reference pictures"
          git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ref-cotl-${{ github.run_number }}
